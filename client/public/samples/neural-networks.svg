<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <rect width="800" height="1000" fill="#FEFEFE"/>
  
  <!-- Title -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Introduction to Neural Networks</text>
  <line x1="100" y1="65" x2="700" y2="65" stroke="#e0e0e0" stroke-width="1"/>
  
  <!-- Neuron Diagram -->
  <text x="100" y="105" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#333">1. The Artificial Neuron</text>
  
  <!-- Inputs -->
  <circle cx="180" cy="180" r="22" fill="#E8F4FD" stroke="#2196F3" stroke-width="2"/>
  <text x="180" y="185" font-family="monospace" font-size="14" text-anchor="middle" fill="#1565C0">x₁</text>
  
  <circle cx="180" cy="250" r="22" fill="#E8F4FD" stroke="#2196F3" stroke-width="2"/>
  <text x="180" y="255" font-family="monospace" font-size="14" text-anchor="middle" fill="#1565C0">x₂</text>
  
  <circle cx="180" cy="320" r="22" fill="#E8F4FD" stroke="#2196F3" stroke-width="2"/>
  <text x="180" y="325" font-family="monospace" font-size="14" text-anchor="middle" fill="#1565C0">x₃</text>
  
  <!-- Weights -->
  <line x1="202" y1="180" x2="338" y2="230" stroke="#666" stroke-width="1.5"/>
  <text x="260" y="195" font-family="monospace" font-size="12" fill="#E65100">w₁</text>
  
  <line x1="202" y1="250" x2="338" y2="250" stroke="#666" stroke-width="1.5"/>
  <text x="260" y="243" font-family="monospace" font-size="12" fill="#E65100">w₂</text>
  
  <line x1="202" y1="320" x2="338" y2="270" stroke="#666" stroke-width="1.5"/>
  <text x="260" y="305" font-family="monospace" font-size="12" fill="#E65100">w₃</text>
  
  <!-- Summation node -->
  <circle cx="360" cy="250" r="28" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
  <text x="360" y="256" font-family="serif" font-size="20" text-anchor="middle" fill="#E65100">Σ</text>
  
  <!-- Bias -->
  <text x="360" y="305" font-family="monospace" font-size="12" text-anchor="middle" fill="#7B1FA2">+ b (bias)</text>
  
  <!-- Arrow to activation -->
  <line x1="388" y1="250" x2="438" y2="250" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/></marker></defs>
  
  <!-- Activation function -->
  <rect x="440" y="222" width="80" height="56" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <text x="480" y="247" font-family="monospace" font-size="13" text-anchor="middle" fill="#2E7D32">f(·)</text>
  <text x="480" y="265" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#388E3C">activation</text>
  
  <!-- Output -->
  <line x1="520" y1="250" x2="580" y2="250" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="610" cy="250" r="22" fill="#FCE4EC" stroke="#E91E63" stroke-width="2"/>
  <text x="610" y="255" font-family="monospace" font-size="14" text-anchor="middle" fill="#C2185B">y</text>
  <text x="610" y="290" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#666">output</text>
  
  <!-- Equation -->
  <rect x="100" y="340" width="600" height="50" rx="6" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
  <text x="400" y="372" font-family="monospace" font-size="18" text-anchor="middle" fill="#1a1a1a">y = f( Σ wᵢ · xᵢ + b )</text>
  
  <!-- Definition -->
  <text x="100" y="430" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#333">2. Definition</text>
  <text x="100" y="460" font-family="sans-serif" font-size="14" fill="#444">A neuron receives weighted inputs, sums them with a bias,</text>
  <text x="100" y="480" font-family="sans-serif" font-size="14" fill="#444">and passes the result through an activation function to</text>
  <text x="100" y="500" font-family="sans-serif" font-size="14" fill="#444">produce an output signal.</text>
  
  <!-- Activation Functions Section -->
  <line x1="100" y1="525" x2="700" y2="525" stroke="#e0e0e0" stroke-width="1"/>
  <text x="100" y="560" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#333">3. Activation Functions</text>
  
  <text x="120" y="590" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">Sigmoid:</text>
  <text x="120" y="615" font-family="monospace" font-size="16" fill="#1a1a1a">σ(x) = 1 / (1 + e⁻ˣ)</text>
  <text x="120" y="640" font-family="sans-serif" font-size="13" fill="#666">Maps any input to a value between 0 and 1.</text>
  
  <text x="420" y="590" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1565C0">ReLU:</text>
  <text x="420" y="615" font-family="monospace" font-size="16" fill="#1a1a1a">f(x) = max(0, x)</text>
  <text x="420" y="640" font-family="sans-serif" font-size="13" fill="#666">Outputs x if positive, 0 otherwise.</text>
  
  <!-- Backpropagation -->
  <line x1="100" y1="670" x2="700" y2="670" stroke="#e0e0e0" stroke-width="1"/>
  <text x="100" y="705" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#333">4. Backpropagation</text>
  
  <text x="100" y="735" font-family="sans-serif" font-size="14" fill="#444">The process of updating weights by propagating the error</text>
  <text x="100" y="755" font-family="sans-serif" font-size="14" fill="#444">backwards through the network using the chain rule.</text>
  
  <!-- Training Loop Diagram -->
  <rect x="120" y="780" width="130" height="40" rx="6" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
  <text x="185" y="805" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1565C0">Forward Pass</text>
  
  <text x="268" y="805" font-family="sans-serif" font-size="16" fill="#999">→</text>
  
  <rect x="285" y="780" width="130" height="40" rx="6" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5"/>
  <text x="350" y="805" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#E65100">Compute Loss</text>
  
  <text x="433" y="805" font-family="sans-serif" font-size="16" fill="#999">→</text>
  
  <rect x="450" y="780" width="130" height="40" rx="6" fill="#FCE4EC" stroke="#C62828" stroke-width="1.5"/>
  <text x="515" y="805" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#C62828">Backward Pass</text>
  
  <!-- Loop arrow -->
  <path d="M 515 820 L 515 850 L 185 850 L 185 820" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="350" y="868" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#999">Update Weights</text>
  
  <!-- Key Insight -->
  <rect x="100" y="900" width="600" height="60" rx="8" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1.5"/>
  <text x="130" y="925" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F57F17">💡 Key Insight:</text>
  <text x="130" y="945" font-family="sans-serif" font-size="13" fill="#555">Neural networks learn by adjusting weights to minimize the difference</text>
  <text x="130" y="960" font-family="sans-serif" font-size="13" fill="#555">between predicted output and actual target (the loss function).</text>
</svg>
